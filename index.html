
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ELVN.CO | Modern Streetwear</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #fff; color: #17251d; }
    header { background: #031308; color: white; padding: 22px 6%; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 27px; font-weight: 900; letter-spacing: 3px; }
    button { cursor: pointer; border: 0; padding: 12px 18px; font-weight: bold; }
    .cart-btn { background: white; color: #031308; border-radius: 5px; }
    .hero { background: #031308; color: white; padding: 75px 6%; }
    .hero h1 { font-size: clamp(38px, 7vw, 75px); letter-spacing: 2px; }
    .hero p { margin-top: 15px; color: #c4d2c7; }
    .section { padding: 45px 6%; }
    .section h2 { font-size: 28px; margin-bottom: 25px; }
    .products { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 22px; }
    .product { border: 1px solid #e6eae7; border-radius: 8px; overflow: hidden; }
    .product img { width: 100%; height: 270px; object-fit: contain; background: #ffffff; }
    .info { padding: 15px; }
    .info h3 { margin-bottom: 9px; }
    .price { font-weight: bold; color: #315d3d; margin-bottom: 12px; }
    .add { width: 100%; background: #031308; color: white; border-radius: 4px; }
    #cart { padding: 25px 6%; background: #f3f6f3; }
    #cartItems { margin: 15px 0; }
    .cart-line { padding: 9px 0; border-bottom: 1px solid #ddd; }
    footer { background: #031308; color: white; padding: 30px 6%; text-align: center; }
    .muted { color: #68756b; }
 .product-main-image {
  cursor: zoom-in;
}

.image-lightbox {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.95);
  z-index: 99999;
  display: flex;
  align-items: center;
  justify-content: center;
}

.image-lightbox img {
  max-width: 90%;
  max-height: 85vh;
  object-fit: contain;
  cursor: zoom-in;
}

.lightbox-btn {
  position: absolute;
  color: white;
  background: transparent;
  border: none;
  font-size: 40px;
  cursor: pointer;
  padding: 15px;
}

.lightbox-close {
  top: 15px;
  right: 20px;
}

.lightbox-prev {
  left: 10px;
}

.lightbox-next {
  right: 10px;
} </style>
</head>
<body>

<header>
  <div class="logo">ELVN.CO</div>
  <button class="cart-btn" onclick="document.getElementById('cart').scrollIntoView()">CART (<span id="count">0</span>)</button>
</header>

<section class="hero">
  <h1>DEFINE YOUR STYLE.</h1>
  <p>Modern Streetwear. Everyday Confidence.</p>
</section>

<section class="section">
  <h2>NEW COLLECTION</h2>
  <div class="products" id="products">
    <p class="muted">Loading products...</p>
  </div>
</section>


<section id="cart" style="background:#f7faf8;padding:25px;border-radius:12px;margin:25px auto;max-width:900px;">
  <h2 style="color:#031308;margin-bottom:20px;">Your Shopping Cart</h2>

  <div id="cartItems">Your cart is empty.</div>

  <div style="border-top:1px solid #ddd;margin-top:20px;padding-top:20px;">
    <h3 style="text-align:right;color:#031308;">
      Subtotal: ৳<span id="total">0</span>
    </h3>
    <button style="width:100%;padding:15px;background:#031308;color:white;border:0;border-radius:6px;font-weight:bold;margin-top:15px;cursor:pointer;">
      PROCEED TO CHECKOUT
    </button>
  </div>
</section>


<footer>
  <h2>ELVN.CO</h2>
  <p style="margin-top:10px">Modern Fashion • Modern Lifestyle</p>
</footer>

<script>
  // নিজের Supabase Project URL ও Publishable Key বসাবে
  const SUPABASE_URL = "https://abfoiyioilostkjncqbp.supabase.co";
  const SUPABASE_KEY = "sb_publishable_AAFZtO78grOiGWivhQPewA_dMp7iWdq";

  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  let cart = [];

  async function loadProducts() {
    const container = document.getElementById("products");

    const { data, error } = await db
      .from("products")
      .select("*")
      .eq("is_active", true)
      .order("created_at", { ascending: false });

   if (error) {
  container.innerHTML = "<p>ERROR: " + escapeHTML(error.message) + "</p>";
  return;
}

    if (!data || data.length === 0) {
      container.innerHTML = "<p class='muted'>New collection coming soon.</p>";
      return;
    }

   
container.innerHTML = data.map(p => {
  const images = Array.isArray(p.images) && p.images.length
    ? p.images
    : [p.image_url].filter(Boolean);

  return `
    <div class="product">
     <img
  class="product-main-image"
  src="${escapeHTML(images[0] || '')}"
  alt="${escapeHTML(p.name)}"
  style="width:100%;height:350px;object-fit:contain;object-position:center;background:#ffffff;"
  onerror="this.style.display='none'"
>

      <div class="product-thumbnails" style="display:flex;gap:8px;margin:10px 0;">
        ${images.map((img, i) => `
          <img
            class="product-thumb"
            data-src="${escapeHTML(img)}"
            src="${escapeHTML(img)}"
            alt="Product image ${i + 1}"
            style="width:55px;height:55px;object-fit:contain;cursor:pointer;border:1px solid #ccc;border-radius:4px;background:white;"
          >
        `).join("")}
      </div>

      <div class="info">
        <h3>${escapeHTML(p.name)}</h3>
        <p class="price">৳${p.price}</p>
        
<div style="margin:12px 0;">
  <label>SELECT SIZE</label>
  <select class="product-size" style="width:100%;padding:10px;margin-top:5px;">
    ${(Array.isArray(p.sizes) && p.sizes.length ? p.sizes : ["One Size"]).map(size => `
      <option value="${escapeHTML(size)}">${escapeHTML(size)}</option>
    `).join("")}
  </select>

  <label style="display:block;margin-top:12px;">QUANTITY</label>
  <input
    class="product-quantity"
    type="number"
    min="1"
    value="1"
    style="width:100%;padding:10px;margin-top:5px;"
  >
</div>

       <button class="add" onclick="addToCart('${p.id}', this)">ADD TO CART</button>
      </div>
    </div>
  `;
}).join("");

container.querySelectorAll(".product-thumb").forEach(thumb => {
  thumb.addEventListener("click", function() {
    const mainImage = this.closest(".product")
      .querySelector(".product-main-image");

    mainImage.src = this.dataset.src;
  });
});

container.querySelectorAll(".product-main-image").forEach((mainImage, index) => {
  const product = data[index];

  const images = Array.isArray(product.images) && product.images.length
    ? product.images
    : [product.image_url].filter(Boolean);

  mainImage.addEventListener("click", function() {
    const currentImage = this.getAttribute("src");
    const currentIndex = Math.max(0, images.indexOf(currentImage));

    openGallery(images, currentIndex);
  });
});
    window.productsData = data;
  }

let galleryImages = [];
let galleryIndex = 0;
let zoomed = false;

function openGallery(images, index) {
  galleryImages = images;
  galleryIndex = index;
  zoomed = false;

  let box = document.getElementById("imageLightbox");

  if (!box) {
    box = document.createElement("div");
    box.id = "imageLightbox";
    box.className = "image-lightbox";
    box.innerHTML = `
      <button class="lightbox-btn lightbox-close" onclick="closeGallery()">×</button>
      <button class="lightbox-btn lightbox-prev" onclick="changeGallery(-1)">❮</button>
      <img id="lightboxImage" onclick="toggleZoom()">
      <button class="lightbox-btn lightbox-next" onclick="changeGallery(1)">❯</button>
    `;
    document.body.appendChild(box);
  }

  showGalleryImage();
}

function showGalleryImage() {
  const img = document.getElementById("lightboxImage");
  img.src = galleryImages[galleryIndex];
  img.style.transform = "scale(1)";
  img.style.cursor = "zoom-in";
  zoomed = false;
}

function changeGallery(direction) {
  galleryIndex = (galleryIndex + direction + galleryImages.length) % galleryImages.length;
  showGalleryImage();
}

function toggleZoom() {
  zoomed = !zoomed;
  const img = document.getElementById("lightboxImage");
  img.style.transform = zoomed ? "scale(2)" : "scale(1)";
  img.style.cursor = zoomed ? "zoom-out" : "zoom-in";
}

function closeGallery() {
  document.getElementById("imageLightbox")?.remove();
}

let touchStartX = 0;

document.addEventListener("touchstart", function(e) {
  if (!e.target.closest("#imageLightbox")) return;
  touchStartX = e.touches[0].clientX;
}, { passive: true });

document.addEventListener("touchend", function(e) {
  if (!e.target.closest("#imageLightbox")) return;

  const touchEndX = e.changedTouches[0].clientX;
  const difference = touchEndX - touchStartX;

  if (Math.abs(difference) > 50) {
    changeGallery(difference < 0 ? 1 : -1);
  }
}, { passive: true });

  function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, c => ({
      "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
    })[c]);
  }

 
function addToCart(id, button) {
  const product = window.productsData.find(p => p.id === id);
  if (!product) return;

  const productBox = button.closest(".product");

  const selectedSize = productBox.querySelector(".product-size").value;
  const quantity = Math.max(
    1,
    parseInt(productBox.querySelector(".product-quantity").value) || 1
  );

  cart.push({
    ...product,
    selectedSize,
    quantity
  });

  renderCart();
}



function renderCart() {
  document.getElementById("count").textContent =
    cart.reduce((sum, p) => sum + Number(p.quantity || 1), 0);

  document.getElementById("total").textContent =
    cart.reduce((sum, p) => sum + Number(p.price) * Number(p.quantity || 1), 0);

  document.getElementById("cartItems").innerHTML = cart.length
    ? cart.map((p, i) => `
        <div class="cart-line" style="display:flex;gap:15px;align-items:center;padding:15px 0;border-bottom:1px solid #ddd;flex-wrap:wrap;">

          <img
            src="${escapeHTML((Array.isArray(p.images) && p.images.length ? p.images[0] : p.image_url) || '')}"
            alt="${escapeHTML(p.name)}"
            style="width:100px;height:110px;object-fit:contain;background:white;border-radius:6px;"
          >

          <div style="flex:1;min-width:150px;">
            <h3>${escapeHTML(p.name)}</h3>
            <p>Size: ${escapeHTML(p.selectedSize || "One Size")}</p>
            <p>Quantity: ${p.quantity || 1}</p>
            <p>Price: ৳${p.price}</p>
            <p><strong>Total: ৳${Number(p.price) * Number(p.quantity || 1)}</strong></p>
            <button onclick="removeItem(${i})" style="padding:7px 12px;background:#031308;color:white;border:0;border-radius:4px;cursor:pointer;">
              REMOVE
            </button>
          </div>

        </div>
      `).join("")
    : "Your cart is empty.";
}



  function removeItem(index) {
    cart.splice(index, 1);
    renderCart();
  }

  loadProducts();
</script>
</body>
</html>
