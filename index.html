/* ELVN.CO PREMIUM SHOPPING CART */

#cart {
  padding: 55px 6%;
  background: #f7f9f7;
  max-width: 1200px;
  margin: 35px auto;
  border-radius: 14px;
}

#cart h2 {

  font-weight: 700;
  letter-spacing: 1px;
  color: #031308;
  margin-bottom: 30px;
}

#cartItems {
  margin: 20px 0;
}

.cart-line {
  display: flex;
  align-items: center;
  gap: 22px;
  padding: 22px;
  margin-bottom: 15px;
  background: #ffffff;
  border: 1px solid #e5ebe5;
  border-radius: 10px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.035);
}
@keyframes removeCartItem {
  from {
    opacity: 1;
    transform: translateX(0) scale(1);
  }
  to {
    opacity: 0;
    transform: translateX(45px) scale(0.96);
  }
}

.cart-line.removing {
  animation: removeCartItem 0.35s ease forwards;
  pointer-events: none;
}
.cart-line img {
  width: 125px !important;
  height: 145px !important;
  object-fit: contain;
  background: #f7f9f7 !important;
  border-radius: 7px !important;
}

.cart-line h3 {

}

.cart-line p {

  padding: 8px 16px;
  border-radius: 5px;
  cursor: pointer;
  margin-top: 10px;
}

#cart h3 {
  color: #031308;
}

#cart button {
  transition: 0.2s ease;
}

#cart button:hover {
  opacity: 0.8;
}

@media (max-width: 600px) {

    footer { background: #031308; color: white; padding: 30px 6%; text-align: center; }

 .product-main-image {

.image-lightbox {

.lightbox-btn {

.lightbox-close {

/* ELVN.CO SMOOTH SLIDE CART */

#cart {
  position: fixed !important;
  top: 0 !important;
  right: 0 !important;
  bottom: 0 !important;
  width: min(480px, 92vw) !important;
  height: 100vh !important;
  max-width: none !important;
  margin: 0 !important;
  border-radius: 0 !important;
  z-index: 10001 !important;
  overflow-y: auto;
  box-sizing: border-box;
  background: #ffffff !important;

  transform: translateX(100%);
  visibility: hidden;
  transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1),
              visibility 0.4s;
  display: block !important;
}

#cart.cart-open {
  transform: translateX(0);
  visibility: visible;
}

body.cart-open::before {
  content: "";
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.48);
  backdrop-filter: blur(3px);
  z-index: 10000;
  animation: cartFade 0.3s ease;
}

@keyframes cartFade {
  from { opacity: 0; }
  to { opacity: 1; }
}

/* ELVN.CO ADD TO CART FLY ANIMATION */

.fly-to-cart {
  position: fixed;
  z-index: 99999;
  pointer-events: none;
  object-fit: contain;
  background: white;
  border-radius: 8px;
  transition:
    transform 0.75s cubic-bezier(0.22, 1, 0.36, 1),
    opacity 0.75s ease;
}

.cart-btn.cart-bounce {
  animation: cartBounce 0.55s ease;
}

@keyframes cartBounce {
  0% { transform: scale(1); }
  35% { transform: scale(1.25); }
  65% { transform: scale(0.92); }
  100% { transform: scale(1); }
}

/* ELVN.CO CART ITEM ANIMATION */

@keyframes cartItemEnter {
  0% {
    opacity: 0;
    transform: translateX(45px) scale(0.96);
    box-shadow: 0 0 0 rgba(0, 0, 0, 0);
  }

  60% {
    opacity: 1;
    transform: translateX(-5px) scale(1.01);
    box-shadow: 0 0 22px rgba(3, 19, 8, 0.16);
  }

  100% {
    opacity: 1;
    transform: translateX(0) scale(1);
    box-shadow: 0 3px 12px rgba(0,0,0,0.035);
  }
}

.cart-line.new-cart-item {
  animation: cartItemEnter 0.65s ease forwards;
}

let galleryImages = [];
let galleryIndex = 0;
let zoomed = false;

function openGallery(images, index) {
  galleryImages = images;
  galleryIndex = index;
  zoomed = false;

  let box = document.getElementById("imageLightbox");

  if (!box) {
    box = document.createElement("div");
    box.id = "imageLightbox";
    box.className = "image-lightbox";
    box.innerHTML = `
      <button class="lightbox-btn lightbox-close" onclick="closeGallery()">×</button>
      <button class="lightbox-btn lightbox-prev" onclick="changeGallery(-1)">❮</button>
      <img id="lightboxImage" onclick="toggleZoom()">
      <button class="lightbox-btn lightbox-next" onclick="changeGallery(1)">❯</button>
    `;
    document.body.appendChild(box);
  }

  showGalleryImage();
}

function showGalleryImage() {
  const img = document.getElementById("lightboxImage");
  img.src = galleryImages[galleryIndex];
  img.style.transform = "scale(1)";
  img.style.cursor = "zoom-in";
  zoomed = false;
}

function changeGallery(direction) {
  galleryIndex = (galleryIndex + direction + galleryImages.length) % galleryImages.length;
  showGalleryImage();
}

function toggleZoom() {
  zoomed = !zoomed;
  const img = document.getElementById("lightboxImage");
  img.style.transform = zoomed ? "scale(2)" : "scale(1)";
  img.style.cursor = zoomed ? "zoom-out" : "zoom-in";
}

function closeGallery() {
  document.getElementById("imageLightbox")?.remove();
}

let touchStartX = 0;

document.addEventListener("touchstart", function(e) {
  if (!e.target.closest("#imageLightbox")) return;
  touchStartX = e.touches[0].clientX;
}, { passive: true });

document.addEventListener("touchend", function(e) {
  if (!e.target.closest("#imageLightbox")) return;

  const touchEndX = e.changedTouches[0].clientX;
  const difference = touchEndX - touchStartX;

  if (Math.abs(difference) > 50) {
    changeGallery(difference < 0 ? 1 : -1);
  }
}, { passive: true });

function renderCart() {
  document.getElementById("count").textContent =
    cart.reduce((sum, p) => sum + Number(p.quantity || 1), 0);

  document.getElementById("total").textContent =

function changeCartQuantity(index, change) {
  if (!cart[index]) return;

  // Clear animation from all products
  cart.forEach(p => {
    p._justAdded = false;
  });

  cart[index].quantity =
    Number(cart[index].quantity || 1) + change;

  if (cart[index].quantity <= 0) {
    cart.splice(index, 1);
  } else {
    cart[index]._justAdded = true;
  }

  renderCart();
}




  
function removeItem(index, button) {
  const product = cart[index];
  if (!product) return;

  const item = button.closest(".cart-line");
  if (!item) return;

  button.disabled = true;

  const animation = item.animate([
    {
      opacity: 1,
      transform: "translateX(0) scale(1)"
    },
    {
      opacity: 0,
      transform: "translateX(45px) scale(0.96)"
    }
  ], {
    duration: 350,
    easing: "cubic-bezier(0.22, 1, 0.36, 1)",
    fill: "forwards"
  });

  animation.onfinish = () => {
    const currentIndex = cart.indexOf(product);

    if (currentIndex !== -1) {
      cart.splice(currentIndex, 1);
    }

    cart.forEach(p => {
      p._justAdded = false;
    });

    renderCart();
  };
}
